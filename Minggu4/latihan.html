<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Latihan Form Validasi</title>
</head>
<body>
    <form onsubmit="return validasiForm()">
        <table>
            <tr>
                <td>Nama</td>
                <td>:</td>
                <td><input type="text" id="nama"></td>
            </tr>
            <tr>
                <td>Email</td>
                <td>:</td>
                <td><input type="text" id="email"></td>
            </tr>
            <tr>
                <td style="vertical-align: top;">Komentar</td>
                <td style="vertical-align: top;">:</td>
                <td><textarea id="komentar" rows="5" cols="30"></textarea></td>
            </tr>
            <tr>
                <td></td>
                <td></td>
                <td><button type="submit">Simpan</button></td>
            </tr>
        </table>
    </form>

    <script>
        function validasiForm() {
            const nama = document.getElementById("nama").value.trim();
            const email = document.getElementById("email").value.trim();
            const komentar = document.getElementById("komentar").value.trim();

            if (nama === "" || email === "" || komentar === "") {
                alert("Semua field (Nama, Email, Komentar) wajib diisi!");
                return false;
            }

            const regexNama = /^[a-zA-Z\s]+$/;
            if (!regexNama.test(nama)) {
                alert("Field Nama tidak boleh mengandung angka atau simbol!");
                return false;
            }

            alert("Data berhasil disimpan!");
            return true;
        }
    </script>
</body>
</html>
