<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Aplikasi Konversi Nilai</title>
</head>
<body>
    <h2>Aplikasi Pengambil Keputusan Nilai</h2>
    <label>Masukkan Nilai (0-100): </label>
    <input type="number" id="inputNilai">
    <button onclick="hitungNilai()">Hitung</button>

    <h3 id="hasilNilai"></h3>

    <script>
        function hitungNilai() {
            const nilai = parseFloat(document.getElementById("inputNilai").value);
            let grade = "";

            if (isNaN(nilai) || nilai < 0 || nilai > 100) {
                alert("Masukkan nilai angka antara 0 hingga 100!");
                return;
            }

            if (nilai >= 0 && nilai <= 20) {
                grade = "E";
            } else if (nilai >= 21 && nilai <= 40) {
                grade = "D";
            } else if (nilai >= 41 && nilai <= 60) {
                grade = "C";
            } else if (nilai >= 61 && nilai <= 80) {
                grade = "B";
            } else if (nilai >= 81 && nilai <= 100) {
                grade = "A";
            }

            document.getElementById("hasilNilai").innerText = "Hasil Grade: " + grade;
        }
    </script>
</body>
</html>
