<!DOCTYPE html>
<html>
<head>
    <title>Tugas 1 - Form Validasi</title>
</head>
<body>
    <form action="" method="post">
        <label>Input 1:</label>
        <input type="text" name="input1" value="Nilai Tetap" readonly><br><br>

        <label>Input 2:</label>
        <input type="text" name="input2" maxlength="5"><br><br>

        <label>Input 3:</label>
        <input type="text" name="input3" disabled><br><br>

        <label>Input 4:</label>
        <input type="text" name="input4" required><br><br>

        <label>Input 5 (NIM):</label>
        <input type="text" name="input5" pattern="[A-Z0-9]{9}" title="Harus 9 karakter, hanya huruf dan angka" minlength="9" maxlength="9" required><br><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
